<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<script src="https://unpkg.com/lightweight-charts@5.0.7/dist/lightweight-charts.standalone.production.js"></script>
<style>
  html, body { margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #ffffff; }
  #wrap { width: 100%; padding-top: 4px; }
  #chart { width: 100%; }
  #hint { padding: 6px 8px 2px; font-size: 12px; color: #888; }
</style>
</head>
<body>
<div id="wrap">
  <div id="chart"></div>
  <div id="hint">TradingView 엔진 · 휠로 줌, 드래그로 팬 · 거래량은 아래 별도 칸</div>
</div>
<script>
"use strict";
let chart = null;
let candleSeries = null;
let volSeries = null;
let markerPrimitive = null;

function post(type, extra) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
}
function setHeight(h) { post("streamlit:setFrameHeight", { height: h }); }

function ensureChart(W, H) {
  const el = document.getElementById("chart");
  if (chart) {
    chart.applyOptions({ width: W, height: H });
    return;
  }
  chart = LightweightCharts.createChart(el, {
    width: W, height: H,
    layout: {
      textColor: "#222",
      background: { type: "solid", color: "#ffffff" },
      fontFamily: "-apple-system, sans-serif",
      // 가격 패널 vs 거래량 패널을 구분짓는 가는 회색선
      panes: { separatorColor: "#cdd2da", separatorHoverColor: "#a4a9b3" }
    },
    grid: {
      vertLines: { color: "#eef0f3" },
      horzLines: { color: "#eef0f3" }
    },
    rightPriceScale: { borderColor: "#cdd2da" },
    timeScale: {
      borderColor: "#cdd2da",
      timeVisible: false, secondsVisible: false,
      rightOffset: 4
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
    handleScroll: { mouseWheel: true, pressedMouseMove: true,
      horzTouchDrag: true, vertTouchDrag: true }
  });
  candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: "#e84a5f", downColor: "#3d6bb3",
    wickUpColor: "#e84a5f", wickDownColor: "#3d6bb3",
    borderVisible: false
  });
  // 거래량 — 별도 패널(pane 1)에 둠 → 캔들과 시각적으로 분리
  volSeries = chart.addSeries(
    LightweightCharts.HistogramSeries,
    { priceFormat: { type: "volume" }, priceScaleId: "right" },
    1
  );
  // 가격 패널 : 거래량 패널 ≈ 4 : 1 비율로 키 설정
  try { chart.panes()[0].setHeight(Math.floor(H * 0.78)); } catch (e) {}
  try { chart.panes()[1].setHeight(Math.floor(H * 0.22)); } catch (e) {}
  markerPrimitive = LightweightCharts.createSeriesMarkers(candleSeries, []);
}

function render(a) {
  const W = Math.max(320, window.innerWidth - 4);
  const H = a.height || 560;
  ensureChart(W, H);

  const dates = a.dates || [];
  const candleData = dates.map((d, i) => ({
    time: d, open: a.o[i], high: a.h[i], low: a.l[i], close: a.c[i]
  }));
  candleSeries.setData(candleData);

  const volData = dates.map((d, i) => ({
    time: d, value: (a.v || [])[i] || 0,
    color: (a.c[i] >= a.o[i]) ? "rgba(232,74,95,0.55)" : "rgba(61,107,179,0.55)"
  }));
  volSeries.setData(volData);

  const markers = [];
  (a.markers || []).forEach((m) => {
    if (m.x < 0 || m.x >= dates.length) return;
    const isBuy = (m.sym || "").indexOf("up") >= 0;
    markers.push({
      time: dates[m.x],
      position: isBuy ? "belowBar" : "aboveBar",
      color: m.color,
      shape: isBuy ? "arrowUp" : "arrowDown",
      text: isBuy ? "매수" : "매도"
    });
  });
  (a.peaks || []).forEach((p) => {
    if (p.x < 0 || p.x >= dates.length) return;
    markers.push({
      time: dates[p.x],
      position: p.kind === "high" ? "aboveBar" : "belowBar",
      color: p.kind === "high" ? "#c62828" : "#1565c0",
      shape: "square",
      text: p.label,
      size: 0
    });
  });
  markers.sort((x, y) => (x.time < y.time ? -1 : x.time > y.time ? 1 : 0));
  if (markerPrimitive && markerPrimitive.setMarkers) {
    markerPrimitive.setMarkers(markers);
  }

  const n = dates.length;
  if (a.viewAll) {
    chart.timeScale().fitContent();
  } else {
    const win = a.window || 200;
    const from = Math.max(0, n - win);
    chart.timeScale().setVisibleLogicalRange({ from: from, to: n - 1 });
  }
  setHeight(H + 26);
}

window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  render(d.args || {});
});
window.addEventListener("resize", () => {
  if (chart) chart.applyOptions({ width: Math.max(320, window.innerWidth - 4) });
});

post("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
