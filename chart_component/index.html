<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  html, body { margin: 0; padding: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  #chart { width: 100%; }
  /* PC(768+) 에선 모드토글 숨김 — 기존 UX(추세선 메인, 휠줌) 유지 */
  #mode-toggle { display: none; gap: 4px; padding: 6px 8px 0; }
  @media (max-width: 768px) {
    #mode-toggle { display: flex; }
  }
  #mode-toggle button { flex: 1; border: 1px solid #ddd; background: #f6f6f6;
    border-radius: 6px; padding: 8px 10px; cursor: pointer; color: #555;
    font-size: 13px; }
  #mode-toggle button.active { background: #ff9500; color: #fff;
    border-color: #ff9500; font-weight: 600; }
  /* #tools = 추세선 칩(선 1, 선 2 …) + [전체 삭제] 영역.
     2026-06-16 사장님: "추세선1 추세선2 + 전체삭제 없어졋다" — iframe
     높이가 안 늘어나 영역이 잘려 보였다. min-height + 옅은 배경으로
     항상 영역이 보이게 + pushState 에서 setHeight 재호출(아래). */
  #tools { display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px; padding: 8px 10px 6px; font-size: 13px; color: #444;
    min-height: 38px; background: #fafafa;
    border-top: 1px solid #eee; }
  #tools .hint { color: #888; }
  .chip { display: inline-flex; align-items: center; gap: 5px;
    background: #fff4e0; border: 1px solid #ffcf87; border-radius: 14px;
    padding: 3px 6px 3px 10px; color: #b35e00; }
  .chip button { border: none; background: #ffb648; color: #fff;
    border-radius: 50%; width: 17px; height: 17px; line-height: 17px;
    font-size: 12px; cursor: pointer; padding: 0; }
  .chip button:hover { background: #ff9500; }
  #clearall { border: 1px solid #ddd; background: #f6f6f6; border-radius: 14px;
    padding: 4px 11px; cursor: pointer; color: #555; }
  #clearall:hover { background: #eee; }
  /* 모바일에서 모드 버튼 더 크게 (탭 친화) */
  @media (max-width: 768px) {
    #mode-toggle button { padding: 10px 8px; font-size: 13px; min-height: 40px; }
    /* 모드바 모바일에서 적당히 크게 + 잘리지 않게 */
    .modebar { transform: scale(1.3); transform-origin: top right; }
    /* tools(chip) 영역 모바일에서 가로 스크롤 가능 — 추세선 많을 때 잘리지 않게 */
    #tools { overflow-x: auto; white-space: nowrap; padding: 4px 6px; }
    #tools .chip { flex-shrink: 0; }
  }
  /* 가로모드(landscape) 추가 보정 — 화면 짧으므로 모드토글 가볍게 */
  @media (max-width: 920px) and (orientation: landscape) and (max-height: 500px) {
    #mode-toggle { padding: 3px 6px 0; }
    #mode-toggle button { padding: 6px 8px; min-height: 32px; font-size: 12px; }
    #tools { padding: 3px 6px; font-size: 12px; }
  }

  /* ── HTS 스타일 그리기 도구 패널 (2026-06-22 사장님 요청) ──
     차트 위에 큰 버튼들로 도구 풀세트. 활성화된 도구는 주황색 강조. */
  #toolbar { display: flex; flex-wrap: wrap; gap: 4px;
    padding: 6px 8px 4px; background: #f8f8f8;
    border-bottom: 1px solid #e5e5e5; }
  #toolbar button { flex: 1 1 0; min-width: 60px; min-height: 38px;
    border: 1px solid #d8d8d8; background: #fff;
    border-radius: 6px; padding: 6px 8px; cursor: pointer;
    color: #444; font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px; }
  #toolbar button:hover { background: #f0f0f0; }
  #toolbar button.active { background: #ff9500; color: #fff;
    border-color: #ff9500; }
  #toolbar button.danger { color: #c0392b; border-color: #e3b7b1; }
  #toolbar button.danger:hover { background: #fdf0ee; }
  @media (max-width: 768px) {
    #toolbar { padding: 4px 6px 3px; gap: 3px; }
    #toolbar button { min-width: 52px; min-height: 36px; font-size: 11px; }
  }
</style>
</head>
<body>
<!-- 2026-06-14 폰 핀치줌 안 되는 문제: 줌/추세선 모드 토글 -->
<!-- 2026-06-20 사장님: 그림도구 + 피보나치 — 피보나치 모드 토글 추가.
     PC/모바일 둘 다 노출(피보나치는 화면 폭과 무관). -->
<div id="mode-toggle">
  <button id="btn-draw" type="button">📏 추세선 그리기</button>
  <button id="btn-zoom" type="button">🔍 이동/줌</button>
</div>
<!-- 2026-06-22 사장님: HTS 처럼 차트 위에 그리기 도구 풀세트.
     활성화된 도구는 주황색 강조. data-mode 가 dragmode/특수모드 식별자. -->
<div id="toolbar">
  <button class="tool" data-mode="drawline">📏 추세선</button>
  <button class="tool" data-mode="hline">─ 수평선</button>
  <button class="tool" data-mode="vline">│ 수직선</button>
  <button class="tool" data-mode="drawrect">⬜ 사각형</button>
  <button class="tool" data-mode="drawcircle">⭕ 원</button>
  <button class="tool" data-mode="drawopenpath">✏️ 자유선</button>
  <button class="tool" data-mode="fib">🔢 피보나치</button>
  <button class="tool" data-mode="eraseshape">🧽 지우개</button>
  <button class="tool danger" data-mode="clearall">🗑 전체 삭제</button>
</div>
<!-- 호환 보존: 이전 fib-bar div 는 비웠지만 adjustHeight 가 참조하므로 유지 -->
<div id="fib-bar" style="display:none;"></div>
<div id="chart"></div>
<div id="tools"></div>
<script>
"use strict";
const ORANGE = "#ff9500";
let gd = document.getElementById("chart");
let toolsEl = document.getElementById("tools");
let bound = false;
// 2026-06-14 PC 는 기본 추세선 그리기(기존 UX 유지),
// 모바일은 기본 pan(핀치줌 자유) — 화면 폭 기반 자동.
let dragMode = (window.innerWidth <= 768) ? "pan" : "drawline";

document.getElementById("btn-draw").addEventListener("click", function () {
  dragMode = "drawline";
  this.classList.add("active");
  document.getElementById("btn-zoom").classList.remove("active");
  if (gd && gd.layout) Plotly.relayout(gd, { dragmode: "drawline" });
});
document.getElementById("btn-zoom").addEventListener("click", function () {
  dragMode = "pan";
  this.classList.add("active");
  document.getElementById("btn-draw").classList.remove("active");
  if (gd && gd.layout) Plotly.relayout(gd, { dragmode: "pan" });
});
// 초기 active 표시 — 모바일은 줌, PC는 그리기 기본
if (window.innerWidth <= 768) {
  document.getElementById("btn-draw").classList.remove("active");
  document.getElementById("btn-zoom").classList.add("active");
} else {
  document.getElementById("btn-draw").classList.add("active");
  document.getElementById("btn-zoom").classList.remove("active");
}

// 2026-06-20: 피보나치 — 7개 라인. 2026-06-22: HTS 도구 패널 + 라벨 + 확장.
// 사용자가 그린 방향(시작점 → 끝점)이 0% → 100%. 확장은 100% 너머.
// r > 1.0 = 확장(extension), r < 0 = 역확장 (잘 안 씀).
const FIB_RATIOS = [
  { r: 0.000, color: "#1f77b4" },     // 시작점
  { r: 0.236, color: "#2ca02c" },
  { r: 0.382, color: "#9467bd" },
  { r: 0.500, color: "#7f7f7f" },
  { r: 0.618, color: "#9467bd" },
  { r: 0.786, color: "#2ca02c" },
  { r: 1.000, color: "#1f77b4" },     // 끝점
  { r: 1.272, color: "#ff8c00" },     // 확장
  { r: 1.618, color: "#d62728" },     // 황금비
];
// currentMode = 도구 패널의 현재 선택 모드 ("drawline"/"hline"/"vline"/
// "drawrect"/"drawcircle"/"drawopenpath"/"fib"/"eraseshape"/null).
// fibMode / hlineMode / vlineMode 는 currentMode 로부터 파생.
let currentMode = (window.innerWidth <= 768) ? null : "drawline";
let fibMode = false;

function setToolActive(mode) {
  document.querySelectorAll("#toolbar button.tool").forEach(function (b) {
    if (b.getAttribute("data-mode") === mode) b.classList.add("active");
    else b.classList.remove("active");
  });
}
function applyMode(mode) {
  currentMode = mode;
  fibMode = (mode === "fib");
  setToolActive(mode);
  // dragmode 설정
  let dm;
  if (mode === "drawline" || mode === "hline" || mode === "vline"
      || mode === "fib") {
    dm = "drawline";
  } else if (mode === "drawrect")    dm = "drawrect";
  else if (mode === "drawcircle")    dm = "drawcircle";
  else if (mode === "drawopenpath")  dm = "drawopenpath";
  else if (mode === "eraseshape")    dm = "eraseshape";
  else dm = "pan";
  dragMode = dm;
  if (gd && gd.layout) Plotly.relayout(gd, { dragmode: dm });
  // mode-toggle(모바일) 상태도 동기화
  if (mode === "drawline" || mode === "hline" || mode === "vline"
      || mode === "fib" || mode === "drawrect" || mode === "drawcircle"
      || mode === "drawopenpath") {
    document.getElementById("btn-draw").classList.add("active");
    document.getElementById("btn-zoom").classList.remove("active");
  }
}
document.querySelectorAll("#toolbar button.tool").forEach(function (b) {
  b.addEventListener("click", function () {
    const m = b.getAttribute("data-mode");
    if (m === "clearall") { clearAll(); return; }
    applyMode(m);
  });
});
// 초기 active — PC 는 추세선, 모바일은 비활성(pan)
setToolActive(currentMode);

// 피보나치 라인 그룹별로 오른쪽 끝에 "61.8%  17,500원" 형식 라벨 생성
function fibAnnotations(shapes) {
  const anns = [];
  (shapes || []).forEach(function (s) {
    const gid = fibGroupId(s);
    if (!gid || !s.name) return;
    const parts = s.name.split("|");
    if (parts.length < 2) return;
    const ratio = parseFloat(parts[1]);
    if (isNaN(ratio)) return;
    const xR = Math.max(s.x0, s.x1);
    const pct = (ratio * 100);
    const pctTxt = (Math.abs(pct - Math.round(pct)) < 0.05)
      ? pct.toFixed(0) + "%"
      : pct.toFixed(1) + "%";
    const priceTxt = (s.y0 != null)
      ? Math.round(s.y0).toLocaleString() + "원"
      : "";
    const color = (s.line && s.line.color) || "#1f77b4";
    anns.push({
      x: xR, y: s.y0, xref: "x", yref: "y",
      text: pctTxt + (priceTxt ? " · " + priceTxt : ""),
      showarrow: false,
      xanchor: "right", yanchor: "middle",
      font: { size: 10, color: color },
      bgcolor: "rgba(255,255,255,0.88)",
      bordercolor: color, borderwidth: 1, borderpad: 2,
    });
  });
  return anns;
}

// 방금 그린 line shape 을 피보나치 라인으로 변환.
// 사용자가 그린 시작점(s.x0,y0)=0%, 끝점(s.x1,y1)=100%.
// 방향 유지 — 위로 그렸으면 100%가 위, 아래로 그렸으면 100%가 아래.
// 확장은 100% 방향으로 더 진행 (1.272, 1.618 = 황금비).
function convertToFib(s, allShapes) {
  const x0 = s.x0, y0 = s.y0;
  const x1 = s.x1, y1 = s.y1;
  const dx = x1 - x0;
  const dy = y1 - y0;
  const groupId = "fib-" + Date.now();
  const fibShapes = FIB_RATIOS.map(function (f) {
    const y = y0 + dy * f.r;
    // x 범위는 시작 x ~ 차트 오른쪽 끝(extendRight가 갱신)
    const xL = Math.min(x0, x1);
    return {
      type: "line", xref: "x", yref: "y",
      x0: xL, y0: y, x1: Math.max(x0, x1), y1: y,
      line: { color: f.color, width: 2, dash: "dot" },
      editable: true, layer: "above",
      name: groupId + "|" + f.r.toFixed(3),
    };
  });
  // 원본 line 제거 + fib 추가
  const idx = allShapes.indexOf(s);
  if (idx >= 0) allShapes.splice(idx, 1);
  return allShapes.concat(fibShapes);
}
let initialized = false;     // 최초 렌더 여부
let lastReset = null;        // 종목 리셋 토큰 (바뀌면 추세선 초기화)

function post(type, extra) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
}
function setValue(v) { post("streamlit:setComponentValue", { value: v, dataType: "json" }); }
function setHeight(h) { post("streamlit:setFrameHeight", { height: h }); }

// 2026-06-20: 추세선(line) 외에도 rect/circle/path + 피보나치 다 저장·복원.
// 피보나치는 shape.name = "fib-{ts}|{ratio}" 로 그룹 마킹.
function shapeToRecord(s) {
  const base = { type: s.type, name: s.name || "" };
  if (s.line) {
    if (s.line.color) base.color = s.line.color;
    if (s.line.dash)  base.dash  = s.line.dash;
    if (s.line.width) base.width = s.line.width;
  }
  if (s.type === "path") {
    return Object.assign(base, { path: s.path });
  }
  return Object.assign(base, { x0: s.x0, y0: s.y0, x1: s.x1, y1: s.y1 });
}
function recordToShape(t) {
  const lineProps = {
    color: t.color || ORANGE,
    width: t.width || 4,
  };
  if (t.dash) lineProps.dash = t.dash;
  const common = { xref: "x", yref: "y",
    line: lineProps, editable: true, layer: "above",
    name: t.name || "" };
  if (t.type === "path") {
    return Object.assign({ type: "path", path: t.path }, common);
  }
  return Object.assign({ type: t.type || "line",
    x0: t.x0, y0: t.y0, x1: t.x1, y1: t.y1 }, common);
}
function lineShapes(trendlines) {
  // 함수명은 호환을 위해 lineShapes 유지 — 실제로는 모든 shape 복원
  return (trendlines || []).map(recordToShape);
}
function collectLines() {
  // 사용자가 그린 모든 도형 직렬화
  return (gd.layout.shapes || [])
    .filter(function (s) {
      return s.type === "line" || s.type === "rect"
        || s.type === "circle" || s.type === "path";
    })
    .map(shapeToRecord);
}
// 피보나치 그룹 ID — shape.name 형식 "fib-1718...|0.382"
function fibGroupId(s) {
  if (!s.name || s.name.indexOf("fib-") !== 0) return null;
  return s.name.split("|")[0];
}
function shapeLabel(s) {
  if (fibGroupId(s)) return "피보나치";
  if (s.name && s.name.indexOf("hline-") === 0) return "수평선";
  if (s.name && s.name.indexOf("vline-") === 0) return "수직선";
  switch (s.type) {
    case "line":   return "추세선";
    case "rect":   return "사각형";
    case "circle": return "원";
    case "path":   return "자유선";
    default:       return "도형";
  }
}
function isHline(s) { return s.name && s.name.indexOf("hline-") === 0; }
function isVline(s) { return s.name && s.name.indexOf("vline-") === 0; }

function buildFigure(a, shapes) {
  const vol = a.v || [];
  // 거래량 막대 색 — 양봉(종가≥시가) 빨강 / 음봉 파랑
  const vColors = (a.x || []).map(function (_, i) {
    return (a.c[i] >= a.o[i]) ? a.up : a.down;
  });
  const traces = [{
    type: "candlestick", x: a.x, open: a.o, high: a.h, low: a.l, close: a.c,
    increasing: { line: { color: a.up }, fillcolor: a.up },
    decreasing: { line: { color: a.down }, fillcolor: a.down },
    name: "가격", showlegend: false
  }, {
    type: "scatter", mode: "lines", x: [a.cur, a.cur], y: [a.ymin, a.ymax],
    line: { color: "#aaa", width: 1, dash: "dot" }, showlegend: false, hoverinfo: "skip"
  }, {
    type: "bar", x: a.x, y: vol, yaxis: "y2",
    marker: { color: vColors }, opacity: 0.5,
    showlegend: false, hoverinfo: "skip", name: "거래량"
  }];
  (a.markers || []).forEach(function (m) {
    traces.push({
      type: "scatter", mode: "markers", x: [m.x], y: [m.y],
      marker: { size: 16, color: m.color, symbol: m.sym,
        line: { width: 2, color: "#ffffff" } },
      showlegend: false, hoverinfo: "text", hovertext: m.text
    });
  });
  // ── 축 범위 고정 — 추세선(연장 포함)이 autorange를 건드려 차트가 움직이는 것 방지.
  //    기울어진 선이 화면 위/아래로 빠져나가도 캔들 위치는 그대로 유지된다.
  const _xs = a.x || [];
  const _xr = _xs.length ? [_xs[0] - 0.6, _xs[_xs.length - 1] + 0.6] : undefined;
  const _yspan = (a.ymax - a.ymin) || 1;
  const _yr = [a.ymin - _yspan * 0.10, a.ymax + _yspan * 0.10];
  // 2026-06-14: 가로모드 폰에서 차트 일부가 viewport 밖으로 잘리는 문제 →
  // window.innerHeight 기반 동적 height. 모바일 가로모드(작은 vh)에선 차트 축소.
  const _isMobile = window.innerWidth <= 768;
  const _vh = window.innerHeight;
  let _chartH = a.height || 560;
  if (_isMobile) {
    // 모바일에선 viewport 의 70% (모드토글·tools 빼고)
    _chartH = Math.max(320, Math.min(_chartH, Math.floor(_vh * 0.7)));
  }
  const layout = {
    height: _chartH, margin: { l: 10, r: 10, t: 30, b: 10 },
    dragmode: dragMode, newshape: { line: { color: ORANGE, width: 4 } },
    shapes: shapes,
    annotations: [
      { xref: "paper", yref: "paper", x: 0, y: 0.205,
        text: "거래량", showarrow: false, xanchor: "left", yanchor: "bottom",
        font: { size: 11, color: "#999" } },
      // 보이는 구간 최고·최저 표시
      ...((a.peaks || []).map(function (p) {
        const isHi = p.kind === "high";
        return {
          x: p.x, y: p.y, xref: "x", yref: "y",
          text: p.label,
          showarrow: true, arrowhead: 2, arrowsize: 1, arrowwidth: 1.5,
          arrowcolor: isHi ? "#c62828" : "#1565c0",
          ax: 0, ay: isHi ? -32 : 32,
          font: { size: 13, color: isHi ? "#c62828" : "#1565c0" },
          bgcolor: "rgba(255,255,255,0.88)",
          bordercolor: isHi ? "#c62828" : "#1565c0",
          borderwidth: 1, borderpad: 3
        };
      })),
      // 피보나치 라벨 — 각 라인 오른쪽 끝에 [%  가격] 표시
      ...fibAnnotations(shapes),
    ],
    xaxis: { rangeslider: { visible: false }, showticklabels: false,
      title: "(봉 번호 숨김)", anchor: "y2",
      range: _xr, autorange: false },
    yaxis: { tickformat: ",.0f", ticksuffix: "원", automargin: true,
      domain: [0.27, 1.0],
      range: _yr, autorange: false },
    yaxis2: { domain: [0.0, 0.2], showticklabels: false, showgrid: false,
      zeroline: false, fixedrange: true },
    showlegend: false
  };
  return { traces: traces, layout: layout };
}

// iframe 전체 높이 재측정 — DOM 실측해서 setHeight 재호출.
// 2026-06-22: HTS 도구 패널(#toolbar) 높이 포함. fib-bar 는 호환만 유지.
function adjustHeight() {
  const modeH = document.getElementById("mode-toggle").offsetHeight || 0;
  const tbH = document.getElementById("toolbar").offsetHeight || 0;
  const chartH = document.getElementById("chart").offsetHeight || 560;
  const toolsH = toolsEl.offsetHeight || 52;
  setHeight(modeH + tbH + chartH + toolsH + 20);
}
function pushState() {
  renderTools();
  adjustHeight();
  setValue({ lines: collectLines() });
}
function deleteLine(idx) {
  let shapes = (gd.layout.shapes || []).slice();
  if (idx < 0 || idx >= shapes.length) return;
  const target = shapes[idx];
  const gid = fibGroupId(target);
  if (gid) {
    // 피보나치 그룹 — 같은 그룹의 모든 라인 제거
    shapes = shapes.filter(function (s) { return fibGroupId(s) !== gid; });
  } else {
    shapes.splice(idx, 1);
  }
  Plotly.relayout(gd, { shapes: shapes }).then(pushState);
}
function clearAll() { Plotly.relayout(gd, { shapes: [] }).then(pushState); }

function renderTools() {
  const shapes = (gd.layout && gd.layout.shapes) ? gd.layout.shapes : [];
  toolsEl.innerHTML = "";
  if (shapes.length === 0) {
    const h = document.createElement("span");
    h.className = "hint";
    h.textContent = "📏 추세선 · ✏️ 자유선 · ⬜ 사각형 · ⭕ 원 — 차트 우상단 도구로 그리고, 🧽 지우개로 개별 삭제. 🔢 피보나치는 위 파란 버튼.";
    toolsEl.appendChild(h);
    return;
  }
  const lab = document.createElement("span");
  lab.textContent = "도형:";
  toolsEl.appendChild(lab);
  // 직렬화 가능한 도형만(line/rect/circle/path) 칩에 노출.
  // 피보나치 그룹은 첫 라인 1개만 칩 표시(7개를 묶음).
  const drawableTypes = ["line", "rect", "circle", "path"];
  const seenFibGroups = {};
  let chipNo = 0;
  shapes.forEach(function (s, i) {
    if (drawableTypes.indexOf(s.type) < 0) return;
    const gid = fibGroupId(s);
    if (gid) {
      if (seenFibGroups[gid]) return;
      seenFibGroups[gid] = true;
    }
    chipNo += 1;
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.appendChild(document.createTextNode(shapeLabel(s) + " " + chipNo));
    const x = document.createElement("button");
    x.textContent = "✕";
    x.title = "이 도형 삭제";
    x.onclick = function () { deleteLine(i); };
    chip.appendChild(x);
    toolsEl.appendChild(chip);
  });
  const ca = document.createElement("button");
  ca.id = "clearall";
  ca.textContent = "🗑 전체 삭제";
  ca.onclick = clearAll;
  toolsEl.appendChild(ca);
}

// ── 수평 스냅 — 거의 수평으로 그은 추세선을 정확히 수평으로 ──
const SNAP_DEG = 2;         // 이 각도 이내(거의 완전 수평)일 때만 수평으로 맞춤
let applyingSnap = false;

function lineAngleDeg(s) {
  const fl = gd._fullLayout;
  if (!fl || !fl.xaxis || !fl.yaxis) return 90;
  const xr = fl.xaxis.range, yr = fl.yaxis.range;
  const dx = (s.x1 - s.x0) / ((xr[1] - xr[0]) || 1) * (fl.xaxis._length || 1);
  const dy = (s.y1 - s.y0) / ((yr[1] - yr[0]) || 1) * (fl.yaxis._length || 1);
  return Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);   // 0(수평)~90(수직)
}
function snapHorizontal() {
  let changed = false;
  (gd.layout.shapes || []).forEach(function (s) {
    if (s.type !== "line") return;
    if (fibGroupId(s) || isHline(s) || isVline(s)) return;
    const ang = lineAngleDeg(s);
    if (ang < SNAP_DEG || ang > 180 - SNAP_DEG) {
      const my = (s.y0 + s.y1) / 2;
      if (s.y0 !== my || s.y1 !== my) { s.y0 = my; s.y1 = my; changed = true; }
    }
  });
  return changed;
}

// ── 오른쪽 연장 — 그린 기울기 그대로 차트 오른쪽 끝까지 늘린다 ──
// 왼쪽 점(작은 x)을 고정 앵커로 두고, 오른쪽 끝(x축 우측 한계)까지 같은 기울기로 연장.
function extendRight() {
  const fl = gd._fullLayout;
  if (!fl || !fl.xaxis) return false;
  const xMax = fl.xaxis.range[1];
  let changed = false;
  const xMin = fl.xaxis.range[0];
  const yRange = (fl.yaxis && fl.yaxis.range) ? fl.yaxis.range : null;
  (gd.layout.shapes || []).forEach(function (s) {
    if (s.type !== "line") return;
    if (fibGroupId(s)) return;       // 피보나치는 오른쪽 끝까지 별도 처리(아래)
    // 수평선: x 범위만 차트 전체로 강제
    if (isHline(s)) {
      if (s.x0 !== xMin || s.x1 !== xMax) {
        s.x0 = xMin; s.x1 = xMax; changed = true;
      }
      return;
    }
    // 수직선: y 범위만 차트 전체로 강제
    if (isVline(s)) {
      if (yRange && (s.y0 !== yRange[0] || s.y1 !== yRange[1])) {
        s.y0 = yRange[0]; s.y1 = yRange[1]; changed = true;
      }
      return;
    }
    // 왼쪽(앵커) / 오른쪽 끝 구분
    let xa, ya, xb, yb;
    if (s.x0 <= s.x1) { xa = s.x0; ya = s.y0; xb = s.x1; yb = s.y1; }
    else { xa = s.x1; ya = s.y1; xb = s.x0; yb = s.y0; }
    if (Math.abs(xb - xMax) < 1e-6) return;        // 이미 끝까지 닿음
    const slope = (yb - ya) / ((xb - xa) || 1e-9);
    s.x0 = xa; s.y0 = ya;
    s.x1 = xMax; s.y1 = ya + slope * (xMax - xa);
    changed = true;
  });
  // 피보나치 그룹별 — 같은 그룹 라인들의 x 범위를 통일하고 오른쪽 끝까지 연장
  const fibGroups = {};
  (gd.layout.shapes || []).forEach(function (s) {
    const gid = fibGroupId(s);
    if (!gid) return;
    if (!fibGroups[gid]) fibGroups[gid] = [];
    fibGroups[gid].push(s);
  });
  Object.keys(fibGroups).forEach(function (gid) {
    const grp = fibGroups[gid];
    const xL = Math.min.apply(null, grp.map(function (s) { return Math.min(s.x0, s.x1); }));
    grp.forEach(function (s) {
      if (s.x0 !== xL || s.x1 !== xMax) {
        s.x0 = xL; s.x1 = xMax;
        changed = true;
      }
    });
  });
  return changed;
}

function render(a) {
  // resize/orientation 시 마지막 args 로 재호출 — gd._lastArgs 보관
  if (a) { gd._lastArgs = a; }
  // 추세선 결정 — 최초 로드/종목 리셋 때만 Python 값을 쓰고,
  // 그 외(봉 전진 등 일반 리렌더)에는 프론트의 현재 추세선을 그대로 유지한다.
  let shapes;
  if (!initialized || a.resetToken !== lastReset) {
    shapes = lineShapes(a.trendlines);
    lastReset = a.resetToken;
    initialized = true;
  } else {
    shapes = (gd.layout && gd.layout.shapes ? gd.layout.shapes : []).slice();
  }
  const f = buildFigure(a, shapes);
  const config = {
    displaylogo: false, scrollZoom: true, responsive: true,
    displayModeBar: true,
    // 2026-06-20: 사장님 요청 — 그림 도구 풀 세트
    // (선/자유선/사각형/원) + 지우개. 피보나치는 별도 토글 버튼(아래 #fib-btn).
    modeBarButtonsToAdd: ["drawline", "drawopenpath",
      "drawrect", "drawcircle", "eraseshape"],
    modeBarButtonsToRemove: ["select2d", "lasso2d"],
    // 두 손가락 핀치줌 명시 활성화
    doubleClick: "reset",
    showAxisDragHandles: true,
    showAxisRangeEntryBoxes: true,
  };
  Plotly.react(gd, f.traces, f.layout, config).then(function () {
    // 봉 전진 등으로 오른쪽 끝이 늘어나면 추세선도 끝까지 다시 연장
    if (extendRight()) { Plotly.relayout(gd, { shapes: gd.layout.shapes }); }
  });
  if (!bound) {
    bound = true;
    gd.on("plotly_relayout", function (ev) {
      if (applyingSnap) return;
      const keys = Object.keys(ev || {});
      const shapeChange = keys.some(function (k) {
        return k === "shapes" || k.indexOf("shapes[") === 0;
      });
      if (!shapeChange) return;

      // 피보나치 모드 — 사용자가 새 line 을 그으면 7개 fib 라인으로 변환
      if (fibMode) {
        const shapes = (gd.layout.shapes || []).slice();
        // 가장 마지막 shape 이 일반 line(name 비어있고 fib 그룹 아님)이면 변환
        const last = shapes.length ? shapes[shapes.length - 1] : null;
        if (last && last.type === "line" && !fibGroupId(last)) {
          const newShapes = convertToFib(last, shapes);
          fibMode = false;
          currentMode = "drawline";
          setToolActive("drawline");
          applyingSnap = true;
          Plotly.relayout(gd, { shapes: newShapes }).then(function () {
            applyingSnap = false;
            renderTools();
            adjustHeight();
            setValue({ lines: collectLines() });
          });
          return;
        }
      }

      // 수평선/수직선 모드 — 사용자가 그린 마지막 line 을 수평/수직으로 강제 정렬
      if (currentMode === "hline" || currentMode === "vline") {
        const shapes = (gd.layout.shapes || []).slice();
        const last = shapes.length ? shapes[shapes.length - 1] : null;
        if (last && last.type === "line" && !fibGroupId(last)
            && !last.name) {
          const fl = gd._fullLayout;
          const xR = fl.xaxis.range;
          const yR = fl.yaxis.range;
          if (currentMode === "hline") {
            const ym = (last.y0 + last.y1) / 2;
            last.x0 = xR[0]; last.x1 = xR[1];
            last.y0 = ym; last.y1 = ym;
            last.name = "hline-" + Date.now();
            last.line = { color: "#e8453c", width: 2, dash: "dash" };
          } else {
            const xm = (last.x0 + last.x1) / 2;
            last.y0 = yR[0]; last.y1 = yR[1];
            last.x0 = xm; last.x1 = xm;
            last.name = "vline-" + Date.now();
            last.line = { color: "#1565c0", width: 2, dash: "dash" };
          }
          applyingSnap = true;
          Plotly.relayout(gd, { shapes: shapes }).then(function () {
            applyingSnap = false;
            renderTools();
            adjustHeight();
            setValue({ lines: collectLines() });
          });
          return;
        }
      }

      const snapped = snapHorizontal();   // 거의 수평인 선을 정확히 수평으로
      const extended = extendRight();      // 오른쪽 끝까지 연장
      if (snapped || extended) {
        applyingSnap = true;
        Plotly.relayout(gd, { shapes: gd.layout.shapes }).then(function () {
          applyingSnap = false;
          renderTools();
          adjustHeight();
          setValue({ lines: collectLines() });
        });
        return;
      }
      renderTools();
      adjustHeight();
      setValue({ lines: collectLines() });
    });
  }
  renderTools();
  // iframe 전체 높이 = 모드토글 + 차트 + tools(chip). DOM 실제 측정.
  setTimeout(adjustHeight, 30);
}

// 화면 회전(가로↔세로) 또는 리사이즈 시 차트·iframe 다시 그림
window.addEventListener("resize", function () {
  if (gd && gd.layout && gd._lastArgs) {
    render(gd._lastArgs);
  }
});
window.addEventListener("orientationchange", function () {
  setTimeout(function () {
    if (gd && gd._lastArgs) render(gd._lastArgs);
  }, 300);
});

window.addEventListener("message", function (e) {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  render(d.args || {});
});

post("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
